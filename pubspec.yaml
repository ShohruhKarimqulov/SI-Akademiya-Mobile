name: si_akademiyasi_mobile
description: SI Akademiyasi mobile application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash/robot.png
    - assets/images/splash/highlight.png
    - assets/images/splash/shade.png
    - assets/images/onboarding/learn.png
    - assets/images/onboarding/assistant.png
    - assets/images/onboarding/practice.png
    - assets/images/auth/login_mascot.png
    - assets/images/profile/meditation_mascot.png
    - assets/images/profile/experience_mascot.png
    - assets/images/profile/python_course.png
    - assets/images/profile/study_mascot.png
    - assets/images/curriculum/bot_project.png
    - assets/icons/actions/arrow-right-light@4x.png
    - assets/icons/auth/email.svg
    - assets/icons/auth/password.svg
    - assets/icons/auth/visibility.svg
    - assets/icons/auth/hide-password.png
    - assets/icons/auth/google.svg
    - assets/icons/auth/speech_tail.svg

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
